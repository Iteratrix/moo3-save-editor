[workspace]
resolver = "2"
members = [
    "moo3-save-core",
    "moo3-save-web",
    "moo3-save-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Iteratrix/moo3-save-editor"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Prevent accidental debug/todo artifacts
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
