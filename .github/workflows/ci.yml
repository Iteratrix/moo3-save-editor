name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags-ignore:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'  # weekly, keeps caches from the 7-day eviction

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  wasm:
    name: WASM + Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build moo3-save-web --target web --out-dir ../web/pkg
      - run: node web/build.mjs
      - name: Bridge test (WASM boundary in Node)
        run: |
          wasm-pack build moo3-save-web --target nodejs --out-dir ../target/wasm-node-test
          node scripts/bridge-test.mjs
      - name: UI test (headless Chrome over CDP)
        run: node scripts/ui-test.mjs
